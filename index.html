<!DOCTYPE html>
<html lang="en">
  <head>
    <title>TIENDA PLUS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Galería de imágenes con pestañas -->
    <div class="tabbed-gallery">
      <div class="btn-row">
        <button class="btn active-btn">Nueva York</button>
        <button class="btn">Honolulú</button>
        <button class="btn">Seúl</button>
      </div>

      <div id="New York" class="city">
        <img src="./img/new-york.jpeg" alt="New York" class="" />
        <p>Nueva York</p>
      </div>

      <div id="Honolulu" class="city hidden-city">
        <img src="./img/honolulu.jpeg" alt="Honolulu" class="" />
        <p>Honolulú</p>
      </div>

      <div id="Seoul" class="city hidden-city">
        <img src="./img/seoul.jpeg" alt="Seoul" class="" />
        <p>Seúl</p>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
